services:
  # 1. Aplikacja PHP / Laravel
  card-app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    image: card-vue-app
    container_name: card_app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    volumes:
      - ./backend:/var/www
    networks:
      - card-app-network

  # 2. Serwer Nginx
  card-web:
    image: nginx:alpine
    container_name: card_web
    restart: unless-stopped
    ports:
      - "8900:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - card-app-network
    depends_on:
      - card-app

  # 3. Aplikacja Frontend (Vue 3)
  card_frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: card_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8900/api
    networks:
      - card-app-network
    depends_on:
      - card-app

  # 4. Baza danych MySQL
  card-db:
    image: mysql:8.0
    container_name: card_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cards}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    ports:
      - "3309:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - card-app-network

  # 5. Panel zarządzania bazą (Adminer)
  card-db-admin:
    image: adminer:latest
    container_name: card_db_admin
    restart: unless-stopped
    ports:
      - "8910:8080"
    networks:
      - card-app-network
    depends_on:
      - card-db

networks:
  card-app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local